name: Scientific regression and snapshot integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install research addon
        run: python -m pip install -e ".[test]"
      - name: Obtain pinned upstream for provenance checks
        run: |
          git clone --branch v1.3.0 https://github.com/sequence-toolbox/SeQUeNCe.git SeQUeNCe
          git -C SeQUeNCe checkout --detach 88f92cca8aaa6dbf82bccc6a759465120afbdd34
      - name: Verify public snapshot
        run: python tools/verify_public_release.py
      - name: Run current regression suite
        run: python -B -m pytest tests -p no:cacheprovider
      - name: Test publication verifier
        run: python -B -m pytest tests_public -p no:cacheprovider
      - name: Reconcile saved scientific evidence
        run: python tools/verify_public_release.py --scientific
