[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dequint-rebuild"
version = "0.1.0"
description = "Reproducible failure- and resource-aware quantum interconnect experiments"
requires-python = ">=3.12"
dependencies = [
    "simpy==4.1.1", "sequence==1.3.0", "qiskit==2.2.3", "qiskit-aer==0.17.2",
    "numpy>=2.0,<3", "scipy>=1.13,<2", "pandas>=2.2,<3", "matplotlib>=3.9,<4",
    "networkx>=3,<4", "pypdf>=5,<7", "reportlab>=4,<5", "pymupdf>=1.25,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

